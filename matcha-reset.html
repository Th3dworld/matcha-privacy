<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Matcha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F6F2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #EAF6EE;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      fill: #45996B;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #28251D;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: #7A7974;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: #45996B;
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 14px;
      text-decoration: none;
      width: 100%;
    }
    .btn:hover { background: #1E6645; }
    .note {
      font-size: 13px;
      color: #BAB9B4;
      margin-top: 16px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1C8.676 1 6 3.676 6 7v1H4v14h16V8h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v1H8V7c0-2.276 1.724-4 4-4zm0 9a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
      </svg>
    </div>
    <h1>Reset your password</h1>
    <p>Tap the button below to open Matcha and set a new password for your account.</p>
    <a class="btn" id="deeplink">Open Matcha</a>
    <p class="note">If the app doesn't open, make sure Matcha is installed on your device.</p>
  </div>

  <script>
    // Read token and email from URL params
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const email = params.get('email') || '';
    const deepLink = `com.matanda.matcha://reset-password?token=${encodeURIComponent(token)}&type=recovery&email=${encodeURIComponent(email)}`;

    const btn = document.getElementById('deeplink');
    btn.href = deepLink;

    // Auto-redirect after short delay
    setTimeout(() => {
      window.location.href = deepLink;
    }, 800);
  </script>
</body>
</html>
